<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #1e3a8a;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .row a {
    color: #3b82f6;
    text-decoration: none;
  }
  .row a:hover { text-decoration: underline; }
  button {
    width: 100%;
    padding: 13px;
    background: #1e3a8a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1e40af; }
  .footer {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    margin-top: 22px;
  }
  .footer a {
    color: #3b82f6;
    text-decoration: none;
    font-weight: 600;
  }
  .footer a:hover { text-decoration: underline; }
  .error {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">YourCompany</div>
    <div class="subtitle">Sign in to your client portal</div>

    <div class="error" id="error">Please enter a valid email and password.</div>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

      <div class="row">
        <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
          <input type="checkbox" id="remember" style="width:auto; margin:0;"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign In</button>
    </form>

    <div class="footer">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Basic client-side validation
      if (!email || !password) {
        errorBox.textContent = 'Please fill in all fields.';
        errorBox.style.display = 'block';
        return;
      }

      // ⚠️ This template has NO backend.
      // Replace this block with a real API call, e.g.:
      //
      // fetch('/api/login', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ email, password })
      // })
      // .then(r => r.json())
      // .then(data => { if (data.token) window.location.href = '/dashboard'; })

      errorBox.textContent = 'This is a front-end demo only — no backend is connected.';
      errorBox.style.display = 'block';
    });
  </script>
</body>
</html>
